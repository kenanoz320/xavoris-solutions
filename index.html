<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SchoolTask</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <header>
        <h1>SchoolTask</h1>

        <p>
            Deine Aufgaben. Dein Überblick.
        </p>
    </header>


    <main>

        <section class="stats">

            <div class="stat-box">
                <h3>Aufgaben</h3>

                <p id="taskCount">
                    {{ tasks|length }}
                </p>
            </div>


            <div class="stat-box">
                <h3>Erledigt</h3>

                <p id="doneCount">
                    0
                </p>
            </div>


            <div class="stat-box">
                <h3>Offen</h3>

                <p id="openCount">
                    0
                </p>
            </div>

        </section>


        <section class="add-section">

            <h2>Neue Aufgabe</h2>

            <form
                action="/add"
                method="POST"
            >

                <input
                    type="text"
                    name="title"
                    placeholder="Was musst du erledigen?"
                    required
                >


                <select name="subject">

                    <option value="Mathe">
                        Mathe
                    </option>

                    <option value="Deutsch">
                        Deutsch
                    </option>

                    <option value="Englisch">
                        Englisch
                    </option>

                    <option value="Informatik">
                        Informatik
                    </option>

                    <option value="Sport">
                        Sport
                    </option>

                    <option value="Sonstiges">
                        Sonstiges
                    </option>

                </select>


                <input
                    type="date"
                    name="date"
                >


                <select name="priority">

                    <option value="niedrig">
                        Niedrig
                    </option>

                    <option value="mittel">
                        Mittel
                    </option>

                    <option value="hoch">
                        Hoch
                    </option>

                </select>


                <button type="submit">
                    + Aufgabe hinzufügen
                </button>

            </form>

        </section>


        <section class="filter-section">

            <h2>Meine Aufgaben</h2>


            <div class="filters">

                <button
                    onclick="filterTasks('all')"
                >
                    Alle
                </button>

                <button
                    onclick="filterTasks('open')"
                >
                    Offen
                </button>

                <button
                    onclick="filterTasks('done')"
                >
                    Erledigt
                </button>

            </div>


            <input
                id="searchInput"
                type="text"
                placeholder="Aufgabe suchen..."
                onkeyup="searchTasks()"
            >

        </section>


        <section class="task-list">

            {% for task in tasks %}

                <article
                    class="task-card
                    {% if task.done %}
                        completed
                    {% endif %}"
                    data-done="{{ task.done }}"
                >

                    <div class="task-info">

                        <h3>
                            {{ task.title }}
                        </h3>


                        <p>
                            📚 {{ task.subject }}
                        </p>


                        <p>
                            📅 {{ task.date }}
                        </p>


                        <span
                            class="priority {{ task.priority }}"
                        >
                            {{ task.priority }}
                        </span>

                    </div>


                    <div class="task-buttons">

                        <form
                            action="/done/{{ task.id }}"
                            method="POST"
                        >

                            <button
                                class="done-button"
                                type="submit"
                            >
                                {% if task.done %}
                                    ↩ Zurück
                                {% else %}
                                    ✓ Erledigt
                                {% endif %}
                            </button>

                        </form>


                        <form
                            action="/delete/{{ task.id }}"
                            method="POST"
                        >

                            <button
                                class="delete-button"
                                type="submit"
                            >
                                🗑 Löschen
                            </button>

                        </form>

                    </div>

                </article>

            {% else %}

                <p class="empty">
                    Noch keine Aufgaben vorhanden.
                </p>

            {% endfor %}

        </section>

    </main>


    <script
        src="{{ url_for('static', filename='script.js') }}"
    >
    </script>

</body>

</html>
